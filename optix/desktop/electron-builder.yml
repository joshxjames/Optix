appId: com.optix.desktop
productName: Optix
copyright: Copyright (c) 2026 Optix contributors
directories:
  output: dist
  buildResources: resources
files:
  - out/**
  - package.json

# Pack the app into an asar archive. This is the default in modern
# electron-builder, but we set it explicitly so the build can't silently
# regress to a loose-files distribution (which would expose source on
# disk and slow startup).
asar: true

# Files that MUST live on disk outside the asar archive:
#   - native .node bindings (robotjs, node-mac-permissions, etc.) cannot
#     be loaded from inside an asar.
#   - any resource that needs a real fs path passed to a native API.
# Add entries here as native deps are introduced. Globs are evaluated
# against the bundled package.json's dependencies.
#
# The catch-all `**/*.node` line is the safety net: any prebuilt native
# binding shipped by a transitive dep gets unpacked automatically.
# The narrower entry below targets @hurdlegroup/robotjs (a fork of the
# original robotjs package) whose prebuilds live under
# `prebuilds/<platform>/<name>.node`. We only unpack those `.node` files,
# not the whole package — sources, headers, and binding.gyp don't need
# to live on disk at runtime.
asarUnpack:
  - "**/*.node"
  - node_modules/@hurdlegroup/robotjs/prebuilds/**/*.node

# Maximum compression — slower builds, smaller installers. Optional;
# remove if CI build time becomes a problem.
compression: maximum

mac:
  target: dmg
  category: public.app-category.education
  artifactName: ${productName}-${version}.${ext}
  # Hardened runtime is required for Apple notarization (Gatekeeper).
  hardenedRuntime: true
  # Gatekeeper assessment must remain on for distributed builds.
  gatekeeperAssess: false
  # TODO (Phase E — code signing): add real signing identity before live
  # release. Use a "Developer ID Application: <Team Name> (<TEAM_ID>)"
  # cert imported into the macOS keychain. Leave null in CI dev builds
  # so the pipeline doesn't fail when no cert is available.
  identity: null
  # TODO (Phase E — notarization): switch this block on once the Apple
  # Developer account + app-specific password are provisioned. Required
  # CI secrets / env vars:
  #   - APPLE_ID                       (Apple ID email)
  #   - APPLE_APP_SPECIFIC_PASSWORD    (generated at appleid.apple.com)
  #   - APPLE_TEAM_ID                  (10-char Team ID from developer.apple.com)
  # Then replace `notarize: false` with:
  #   notarize:
  #     teamId: ${env.APPLE_TEAM_ID}
  # electron-builder reads APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD from
  # the environment automatically.
  notarize: false
  # Entitlements file (create resources/entitlements.mac.plist with
  # com.apple.security.cs.allow-jit etc. if/when JIT-using deps land).
  # entitlements: resources/entitlements.mac.plist
  # entitlementsInherit: resources/entitlements.mac.plist

win:
  # NSIS — required for auto-update on Windows. The previous `portable`
  # target shipped a single self-contained .exe that runs from anywhere,
  # but electron-updater can't replace a running portable executable.
  # NSIS gives the user a real install (writes to %LOCALAPPDATA%\Optix
  # by default; per-user, no admin elevation), and the installer is
  # what auto-update replaces in place.
  #
  # If a no-install distribution becomes important again, add a
  # secondary `portable` target alongside this one — but auto-update
  # only fires for the NSIS channel.
  target: nsis
  artifactName: ${productName}-${version}.${ext}
  # TODO (Phase E — Authenticode signing): wire signtool once a code
  # signing certificate is procured. Required CI secrets / env vars:
  #   - WINDOWS_CERT_FILE        (path to the .pfx file in the runner)
  #   - WINDOWS_CERT_PASSWORD    (password for the .pfx)
  # Then add the following block under `win:`:
  #   signtoolOptions:
  #     certificateFile: ${env.WINDOWS_CERT_FILE}
  #     certificatePassword: ${env.WINDOWS_CERT_PASSWORD}
  #     publisherName: "Optix"
  #     signingHashAlgorithms:
  #       - sha256
  #     rfc3161TimeStampServer: http://timestamp.digicert.com
  # Leaving certificateFile unset for now so unsigned dev builds work.
  # certificateFile: null

# Auto-update feed.
#
# `provider: generic` + `url: <Firebase Hosting URL>` tells electron-
# builder to write a `latest.yml` (Win) / `latest-mac.yml` (Mac) into
# the build output, AND to bake the same URL into the bundled
# `app-update.yml` so the autoUpdater runtime knows where to look.
#
# Releasing flow once certs are wired up:
#   1. Bump `version` in package.json
#   2. `pnpm package:win` (or :mac) — produces a signed .exe + the
#      latest.yml manifest in optix/desktop/dist/
#   3. `firebase deploy --only hosting:updates` from optix-cloud/
#      uploads everything under that to the updates Firebase Hosting
#      site (configured separately from the marketing site)
#   4. Existing installed copies pick it up on their next 4-hour
#      check, download in the background, show the in-app banner
#
# The URL below is the placeholder until the multi-site Firebase
# Hosting setup lands. See `docs/AUTOUPDATE.md` for the full release
# checklist + cert procurement notes.
publish:
  provider: generic
  url: https://optix-22473.web.app/updates/
  # Don't trust signature verification yet — until production builds
  # are signed (Authenticode + Apple Developer ID, Phase E), turning
  # this off lets dev/test builds auto-update across iterations. Flip
  # to `true` (or remove — it's the default) once signing is wired up.
  publishAutoUpdate: true
